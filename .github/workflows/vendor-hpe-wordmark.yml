name: Vendor official HPE wordmark

on:
  push:
    branches:
      - cursor/datadog-cro-template

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download from HPE
        run: |
          SOURCE="https://www.hpe.com/apps/hpeweb-ui/images/gn-icons/logo-lm.svg"
          if ! curl --fail --location --http1.1 --compressed \
            --connect-timeout 10 --max-time 30 \
            --user-agent "Mozilla/5.0" \
            --referer "https://www.hpe.com/" \
            "$SOURCE" --output hpe-wordmark.svg &&
            ! wget --timeout=30 --tries=1 \
              --user-agent="Mozilla/5.0" \
              --referer="https://www.hpe.com/" \
              "$SOURCE" --output-document=hpe-wordmark.svg; then
            curl --fail --location --max-time 30 \
              "https://r.jina.ai/http://www.hpe.com/apps/hpeweb-ui/images/gn-icons/logo-lm.svg" \
              --output hpe-wordmark.svg
          fi
          test "$(wc -c < hpe-wordmark.svg)" -eq 267
          grep -q "<svg" hpe-wordmark.svg

      - name: Upload exact asset
        uses: actions/upload-artifact@v4
        with:
          name: hpe-wordmark
          path: hpe-wordmark.svg
          if-no-files-found: error
