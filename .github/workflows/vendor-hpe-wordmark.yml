name: Vendor official HPE wordmark

on:
  push:
    branches:
      - cursor/datadog-cro-template

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download from HPE
        run: |
          curl --fail --location --max-time 30 --get \
            --data-urlencode "q=context:global file:logo-lm.svg" \
            --data-urlencode "v=V3" \
            "https://sourcegraph.com/search/stream" \
            --output sourcegraph.txt
          cat sourcegraph.txt
          exit 1

      - name: Upload exact asset
        uses: actions/upload-artifact@v4
        with:
          name: hpe-wordmark
          path: hpe-wordmark.svg
          if-no-files-found: error
